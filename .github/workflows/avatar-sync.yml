name: Avatar Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 1'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm install sharp

      - name: Sync LinkedIn profile photo
        env:
          CI: 'true'
          LINKEDIN_COOKIES: ${{ secrets.LINKEDIN_COOKIES }}
        run: node scripts/sync-avatar.mjs

      - name: Upload debug screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug-page.png
          retention-days: 7

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/ayaz-avatar.png public/favicon-*.png public/favicon.ico public/apple-touch-icon.png index.html
          git diff --staged --quiet || git commit -m "chore: auto-sync LinkedIn profile photo [skip ci]"
          git push